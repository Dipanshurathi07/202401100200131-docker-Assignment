<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>FestPass 2026</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
        }

        main {
            width: min(100%, 680px);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #5b62d6;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.25rem);
            letter-spacing: -0.055em;
        }

        .intro {
            margin: 12px 0 28px;
            color: #667085;
            line-height: 1.6;
        }

        .panel {
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid #e6e9f1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px rgb(26 35 64 / 8%);
        }

        .status {
            margin: 0 0 24px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #eef2ff;
            color: #3842a5;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status[data-state="error"] {
            background: #fff0ef;
            color: #a32d25;
        }

        .status[data-state="warning"] {
            background: #fff7e6;
            color: #8a5700;
        }

        form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) auto;
            gap: 10px;
        }

        input,
        select,
        button {
            min-height: 46px;
            border: 1px solid #d9deea;
            border-radius: 10px;
            font: inherit;
        }

        input,
        select {
            min-width: 0;
            padding: 0 12px;
            background: #fff;
            color: inherit;
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 3px solid rgb(91 98 214 / 25%);
            outline-offset: 2px;
        }

        button {
            padding: 0 18px;
            border-color: #4f46e5;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover:not(:disabled) {
            background: #4038c9;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        h2 {
            margin: 28px 0 12px;
            font-size: 1.05rem;
        }

        #list {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #list li {
            padding: 12px 14px;
            border: 1px solid #edf0f5;
            border-radius: 10px;
            background: #fafbfe;
        }

        .empty {
            color: #778096;
            font-size: 0.92rem;
        }

        @media (max-width: 580px) {
            body {
                padding: 28px 16px;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">FestPass · Tech Fest 2026</p>
        <h1>Save your spot.</h1>
        <p class="intro">Choose an event and register. Your registration will appear here.</p>

        <section class="panel" aria-label="FestPass registrations">
            <p id="status" class="status" data-state="loading" role="status" aria-live="polite">
                Connecting to the FestPass backend...
            </p>
            <form id="form">
                <input
                    id="name"
                    name="name"
                    placeholder="Your name"
                    aria-label="Your name"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
                <select id="event" name="event" aria-label="Choose an event">
                    <option>Hackathon</option>
                    <option>Robo Race</option>
                    <option>Tech Quiz</option>
                </select>
                <button id="submit" type="submit" disabled>Register</button>
            </form>

            <h2>Registrations</h2>
            <ul id="list" aria-live="polite">
                <li class="empty">Loading registrations...</li>
            </ul>
        </section>
    </main>
    <script>
        const form = document.getElementById("form");
        const status = document.getElementById("status");
        const submit = document.getElementById("submit");
        const list = document.getElementById("list");

        async function api(path, options) {
            const response = await fetch("/api/" + path, options);
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || `Request failed (${response.status})`);
            }
            return result;
        }

        function showStatus(message, state) {
            status.textContent = message;
            status.dataset.state = state;
        }

        async function refresh() {
            try {
                const health = await api("health");
                if (!health.database) {
                    submit.disabled = true;
                    list.replaceChildren();
                    showStatus(
                        `Backend ${health.version} is running, but the database is not connected yet.`,
                        "warning"
                    );
                    return;
                }

                const rows = await api("registrations");
                submit.disabled = false;
                showStatus(
                    `REGNO ${health.regno} · backend ${health.version} · database connected`,
                    "success"
                );

                if (rows.length === 0) {
                    const empty = document.createElement("li");
                    empty.className = "empty";
                    empty.textContent = "No registrations yet. Be the first!";
                    list.replaceChildren(empty);
                    return;
                }

                list.replaceChildren(...rows.map((registration) => {
                    const item = document.createElement("li");
                    item.textContent =
                        `#${registration.id} ${registration.name} (${registration.event})`;
                    return item;
                }));
            } catch (error) {
                submit.disabled = true;
                showStatus(
                    error.message || "Could not connect to the FestPass backend.",
                    "error"
                );
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            submit.disabled = true;

            try {
                await api("registrations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        event: document.getElementById("event").value,
                    }),
                });
                form.reset();
                await refresh();
            } catch (error) {
                showStatus(error.message || "Could not save your registration.", "error");
                submit.disabled = false;
            }
        });

        refresh();
    </script>
</body>
</html>
