services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}"
    volumes:
      - festpass-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-database

  backend:
    image: fest-backend:0.1
    build:
      context: ./backend
    environment:
      REGNO: "${REGNO:?Set REGNO in your local .env file}"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}"
      APP_VERSION: dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health',timeout=2))['database']"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend-backend
      - backend-database

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:?Set PORT in your local .env file}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend-backend

networks:
  frontend-backend:
  backend-database:
    internal: true

volumes:
  festpass-data:
